<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>סיכום 3 שעות</title>
  <style>
    :root {
      --bg: #0b1220; --panel: #121b2e; --panel-2: #182338; --line: #2a3a58;
      --text: #e8eef8; --muted: #93a0b8; --gold: #e3b341; --ok: #3dcf8e; --warn: #f0b429;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", "Heebo", Arial, sans-serif; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 20px 14px 48px; }
    h1 { margin: 0 0 4px; font-size: 1.45rem; }
    .sub { color: var(--muted); margin: 0 0 16px; line-height: 1.45; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    button { appearance: none; border: 0; cursor: pointer; font-weight: 700; background: var(--gold); color: #1a1404; border-radius: 12px; padding: 11px 14px; font-size: .95rem; }
    button.secondary { background: #243552; color: var(--text); }
    .meta { color: var(--muted); font-size: .85rem; }
    .status { padding: 10px 12px; border-radius: 12px; background: #0e1626; border: 1px solid var(--line); color: var(--muted); margin-bottom: 14px; }
    .status.ok { color: var(--ok); border-color: #1f5c43; }
    .status.warn { color: var(--warn); }
    .card { background: linear-gradient(180deg, var(--panel), var(--panel-2)); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .digest { white-space: pre-wrap; line-height: 1.65; font-size: 1rem; }
    .item { padding: 12px 0; border-bottom: 1px solid #223049; }
    .item:last-child { border-bottom: 0; }
    .item a { color: var(--text); text-decoration: none; font-weight: 700; line-height: 1.4; }
    .item a:hover { color: var(--gold); }
    .src { color: var(--muted); font-size: .8rem; margin-top: 4px; }
    .count { background: #243552; color: var(--gold); border-radius: 999px; padding: 2px 8px; font-size: .75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>המוח המקומי — /summary3h</h1>
    <p class="sub">בלי Replit. אוסף מבזקים ממקורות פתוחים ב־3 השעות האחרונות, מסנן כפילויות ומציג סיכום כאן.</p>
    <div class="bar">
      <button id="run" type="button">הפק סיכום עכשיו</button>
      <button id="copy" class="secondary" type="button">העתק סיכום</button>
      <button id="openBot" class="secondary" type="button">פתח בוט בטלגרם</button>
      <span class="meta" id="clock"></span>
    </div>
    <div class="status" id="status">טוען סיכום…</div>
    <section class="card"><div id="digest" class="digest">ממתין לנתונים.</div></section>
    <section class="card" id="list"></section>
  </div>
  <script>
    const HOURS = 3;
    const BOT = "https://t.me/newsOren3515_bot";
    const FEEDS = [
      { name: "ynet חדשות", url: "https://www.ynet.co.il/Integration/StoryRss2.xml" },
      { name: "ynet מבזקים", url: "https://www.ynet.co.il/Integration/StoryRss1854.xml" },
      { name: "וואלה", url: "https://rss.walla.co.il/feed/1" },
      { name: "מעריב מבזקים", url: "https://www.maariv.co.il/Rss/RssFeedsMivzakim" },
      { name: "Google News IL", url: "https://news.google.com/rss?hl=he&gl=IL&ceid=IL:he" }
    ];
    const PROXIES = [
      (u) => "https://corsproxy.io/?" + encodeURIComponent(u),
      (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u)
    ];
    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const digestEl = $("digest");
    const listEl = $("list");
    const setStatus = (t, k) => { statusEl.textContent = t; statusEl.className = "status" + (k ? " " + k : ""); };
    const tick = () => { $("clock").textContent = new Date().toLocaleString("he-IL", { dateStyle: "short", timeStyle: "medium" }); };
    tick(); setInterval(tick, 1000);
    const decode = (s) => {
      const t = document.createElement("textarea");
      t.innerHTML = (s || "").replace(/<!\[CDATA\[|\]\]>/g, "");
      return t.value.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    };
    const parseRss = (xml, source) => {
      const doc = new DOMParser().parseFromString(xml, "text/xml");
      return [...doc.querySelectorAll("item")].map((item) => {
        const title = decode(item.querySelector("title")?.textContent);
        const link = (item.querySelector("link")?.textContent || "").trim();
        const pub = item.querySelector("pubDate")?.textContent || "";
        const date = pub ? new Date(pub) : null;
        return { title, link, date, source };
      }).filter((x) => x.title);
    };
    const fetchText = async (url) => {
      let last;
      for (const make of PROXIES) {
        try {
          const res = await fetch(make(url), { cache: "no-store" });
          if (!res.ok) throw new Error(res.status);
          return await res.text();
        } catch (e) { last = e; }
      }
      throw last || new Error("fetch failed");
    };
    const tokens = (title) => title.replace(/[^\u0590-\u05FFa-zA-Z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 2);
    const similar = (a, b) => {
      const A = new Set(tokens(a)); const B = new Set(tokens(b));
      if (!A.size || !B.size) return 0;
      let n = 0; for (const x of A) if (B.has(x)) n++;
      return n / Math.min(A.size, B.size);
    };
    const cluster = (items) => {
      const groups = [];
      for (const item of items) {
        const hit = groups.find((g) => similar(g[0].title, item.title) >= 0.55);
        if (hit) hit.push(item); else groups.push([item]);
      }
      return groups.sort((a, b) => b.length - a.length || ((b[0].date || 0) - (a[0].date || 0)));
    };
    const fmtTime = (d) => d && !isNaN(d) ? d.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }) : "";
    const buildDigest = (groups, from, to) => {
      const lines = ["סיכום " + HOURS + " השעות האחרונות", from.toLocaleString("he-IL") + " → " + to.toLocaleString("he-IL"), "אירועים ייחודיים: " + groups.length, ""];
      groups.slice(0, 18).forEach((g, i) => {
        const srcs = [...new Set(g.map((x) => x.source))].join(", ");
        lines.push((i + 1) + ". " + g[0].title);
        lines.push("   " + (fmtTime(g[0].date) || "") + " · " + srcs + (g.length > 1 ? " · " + g.length + " מקורות" : ""));
      });
      return lines.join("\n");
    };
    const run = async () => {
      setStatus("מושך מקורות…");
      const now = new Date();
      const from = new Date(now.getTime() - HOURS * 60 * 60 * 1000);
      const results = await Promise.allSettled(FEEDS.map(async (f) => parseRss(await fetchText(f.url), f.name)));
      const ok = results.filter((r) => r.status === "fulfilled").map((r) => r.value).flat();
      const failed = results.filter((r) => r.status === "rejected").length;
      const recent = ok.filter((x) => !x.date || isNaN(x.date) || (x.date >= from && x.date <= now));
      const withDate = recent.filter((x) => x.date && !isNaN(x.date)).sort((a, b) => b.date - a.date);
      const noDate = recent.filter((x) => !x.date || isNaN(x.date));
      const items = [...withDate, ...noDate];
      const groups = cluster(items);
      if (!groups.length) {
        setStatus("לא נמצאו ידיעות בחלון הזמן.", "warn");
        digestEl.textContent = "אין נתונים."; listEl.innerHTML = ""; return;
      }
      const text = buildDigest(groups, from, now);
      digestEl.textContent = text;
      localStorage.setItem("summary3h_local", text);
      listEl.innerHTML = groups.map((g) => {
        const it = g[0];
        return `<div class="item"><a href="${it.link || "#"}" target="_blank" rel="noopener">${it.title}</a>
          <div class="src">${fmtTime(it.date)} · ${[...new Set(g.map(x=>x.source))].join(" · ")}
          ${g.length > 1 ? `<span class="count">${g.length}</span>` : ""}</div></div>`;
      }).join("");
      setStatus("מוכן. " + groups.length + " ידיעות ייחודיות מתוך " + items.length + " כתבות" + (failed ? " (" + failed + " מקורות לא נטענו)" : "") + ".", failed ? "warn" : "ok");
    };
    $("run").onclick = run;
    $("openBot").onclick = () => window.open(BOT, "_blank");
    $("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(digestEl.textContent || ""); setStatus("הסיכום הועתק.", "ok"); }
      catch { setStatus("ההעתקה נחסמה.", "warn"); }
    };
    run();
  </script>
</body>
</html>
