name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Replit control page
        run: |
          set +e
          for i in 1 2 3; do
            echo "try $i"
            curl -sS -L --max-time 45 -o /tmp/body -w "replit:%{http_code}\n" \
              "https://mahadura-news--orenba83.replit.app/" || true
            curl -sS -L --max-time 20 -o /dev/null -w "railway:%{http_code}\n" \
              "https://web-production-2f4b1.up.railway.app/" || true
            sleep 8
          done
          head -c 200 /tmp/body || true
          echo
